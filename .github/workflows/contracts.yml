name: Service contracts

on:
  pull_request:
    paths:
      - 'cmd/or3-intern/**'
      - 'clients/typescript/**'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/or3-intern/**'
      - 'clients/typescript/**'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - name: Verify frozen service fixtures
        run: go test ./cmd/or3-intern -run 'Contract|Fixture' -count=1
      - name: Test TypeScript client
        working-directory: clients/typescript
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
      - name: Verify committed TypeScript client bundle
        run: git diff --exit-code -- clients/typescript/dist/index.js
