name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/publish.yml'
      - 'cmd/or3-intern/**'
      - 'internal/**'
      - 'packages/or3/**'
      - 'clients/typescript/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'cmd/or3-intern/**'
      - 'internal/**'
      - 'packages/or3/**'
      - 'clients/typescript/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  id-token: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  binaries:
    needs: security
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          VERSION="dev"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_LDFLAGS="-s -w -X main.buildVersion=${VERSION} -X main.buildCommit=${GITHUB_SHA} -X main.buildDirty=false -X main.buildTime=${BUILD_TIME}"
          if [ "$GOOS" = 'linux' ]; then
            go build -trimpath -ldflags="$BUILD_LDFLAGS -linkmode external -extldflags '-static'" -o dist/or3-intern ./cmd/or3-intern
          else
            go build -trimpath -ldflags="$BUILD_LDFLAGS" -o dist/or3-intern ./cmd/or3-intern
          fi
          tar -C dist -czf "or3-intern-${GOOS}-${GOARCH}.tar.gz" or3-intern
      - name: Smoke test archive and SQLite vector runtime
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          mkdir -p smoke
          tar -C smoke -xzf "or3-intern-${GOOS}-${GOARCH}.tar.gz"
          ./smoke/or3-intern version
          ./smoke/or3-intern connect --help | grep -F 'openclaw'
          ./smoke/or3-intern connect --help | grep -F 'hermes'
          go test ./internal/db -run '^TestOpen_CreatesDB$' -count=1
      - name: Smoke test the Linux archive on Alpine
        if: matrix.goos == 'linux'
        run: docker run --rm -v "$PWD/smoke:/smoke:ro" alpine:3.20 /smoke/or3-intern version
      - uses: actions/upload-artifact@v4
        with:
          name: or3-intern-${{ matrix.goos }}-${{ matrix.goarch }}
          path: or3-intern-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11
      - name: Verify release versions and immutable registry targets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for PACKAGE in packages/or3 clients/typescript; do
            ACTUAL_VERSION="$(node -p "require('./${PACKAGE}/package.json').version")"
            if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
              echo "${PACKAGE} version ${ACTUAL_VERSION} does not match tag ${VERSION}" >&2
              exit 1
            fi
            NAME="$(node -p "require('./${PACKAGE}/package.json').name")"
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} already exists and cannot be republished" >&2
              exit 1
            fi
          done
      - name: Qualify immutable npm tarballs
        run: |
          npm test --prefix packages/or3
          npm pack --json --prefix packages/or3 > packages/or3/pack.json
          npm test --prefix clients/typescript
          npm pack --json --prefix clients/typescript > clients/typescript/pack.json
      - name: Smoke-test the released one-command bootstrap
        working-directory: packages/or3
        run: |
          TARBALL="$(node -e "console.log(require('./pack.json')[0].filename)")"
          npm exec --yes --package="./$TARBALL" -- or3 intern --help
      - name: Publish qualified TypeScript client tarball
        working-directory: clients/typescript
        run: |
          TARBALL="$(node -e "console.log(require('./pack.json')[0].filename)")"
          npm publish "${TARBALL}" --access public --provenance
      - name: Publish qualified npx bootstrap tarball
        working-directory: packages/or3
        run: |
          TARBALL="$(node -e "console.log(require('./pack.json')[0].filename)")"
          npm publish "${TARBALL}" --access public --provenance
      - name: Verify exact published versions after bounded registry propagation
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"

          wait_for_version() {
            PACKAGE="$1"
            for ATTEMPT in $(seq 1 12); do
              OBSERVED="$(npm view "${PACKAGE}@${VERSION}" version --json 2>/dev/null || true)"
              if [ "$OBSERVED" = "\"${VERSION}\"" ] || [ "$OBSERVED" = "$VERSION" ]; then
                return 0
              fi
              sleep "$((ATTEMPT * 5))"
            done
            echo "${PACKAGE}@${VERSION} was not visible on npm after bounded retries" >&2
            exit 1
          }

          wait_for_version "@or3/intern-client"
          wait_for_version "@or3/connect"

      - name: Smoke-test exact Connect package with Node 20 Alpine
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          docker run --rm --cpus=1 --memory=512m -e CONNECT_VERSION="$VERSION" node:20-alpine \
            sh -ceu '
            for ATTEMPT in $(seq 1 6); do
              if npx --yes --package="@or3/connect@${CONNECT_VERSION}" or3 intern --help; then
                exit 0
              fi
              sleep "$((ATTEMPT * 5))"
            done
            echo "exact @or3/connect@${CONNECT_VERSION} intern bootstrap did not propagate" >&2
            exit 1'
