name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/publish.yml'
      - 'cmd/or3-intern/**'
      - 'internal/**'
      - 'packages/or3/**'
      - 'clients/typescript/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'cmd/or3-intern/**'
      - 'internal/**'
      - 'packages/or3/**'
      - 'clients/typescript/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  id-token: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/or3-intern ./cmd/or3-intern
          tar -C dist -czf "or3-intern-${GOOS}-${GOARCH}.tar.gz" or3-intern
      - name: Smoke test archive and SQLite vector runtime
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          mkdir -p smoke
          tar -C smoke -xzf "or3-intern-${GOOS}-${GOARCH}.tar.gz"
          ./smoke/or3-intern version
          ./smoke/or3-intern connect --help | grep -F 'openclaw'
          ./smoke/or3-intern connect --help | grep -F 'hermes'
          go test ./internal/db -run '^TestOpen_CreatesDB$' -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: or3-intern-${{ matrix.goos }}-${{ matrix.goarch }}
          path: or3-intern-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11
      - name: Verify npm bootstrap
        working-directory: packages/or3
        run: |
          npm test
          npm pack --dry-run
      - name: Verify TypeScript client package
        working-directory: clients/typescript
        run: |
          npm test
          npm pack --dry-run
      - name: Publish npx bootstrap
        working-directory: packages/or3
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public
      - name: Publish TypeScript client
        working-directory: clients/typescript
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public
